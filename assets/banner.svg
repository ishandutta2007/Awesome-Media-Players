<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1a103c" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.15) translate(25px, -15px); opacity: 0.6; }
      100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
    }
    @keyframes waveBar {
      0%, 100% { height: 16px; y: 242px; }
      50% { height: 48px; y: 210px; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); opacity: 0.2; }
      50% { transform: translateY(-20px) rotate(180deg); opacity: 0.7; }
      100% { transform: translateY(0px) rotate(360deg); opacity: 0.2; }
    }
    .orb-anim-1 { animation: pulseOrb 8s ease-in-out infinite; transform-origin: center; }
    .orb-anim-2 { animation: pulseOrb 10s ease-in-out infinite reverse; transform-origin: center; }
    .bar-1 { animation: waveBar 1.2s ease-in-out infinite 0.1s; }
    .bar-2 { animation: waveBar 1.2s ease-in-out infinite 0.3s; }
    .bar-3 { animation: waveBar 1.2s ease-in-out infinite 0.5s; }
    .bar-4 { animation: waveBar 1.2s ease-in-out infinite 0.2s; }
    .bar-5 { animation: waveBar 1.2s ease-in-out infinite 0.4s; }
    .bar-6 { animation: waveBar 1.2s ease-in-out infinite 0.6s; }
    .bar-7 { animation: waveBar 1.2s ease-in-out infinite 0.15s; }
    .particle { animation: floatParticle 6s ease-in-out infinite; }
  </style>

  <!-- Canvas Container -->
  <rect width="1196" height="336" x="2" y="2" rx="20" fill="url(#bgGrad)" stroke="#374151" stroke-width="1.5" filter="url(#cardShadow)"/>

  <!-- Dynamic Glowing Background Elements (Kept strictly behind and to sides) -->
  <g class="orb-anim-1">
    <circle cx="150" cy="80" r="140" fill="#6366f1" opacity="0.25" filter="blur(40px)" />
  </g>
  <g class="orb-anim-2">
    <circle cx="1060" cy="240" r="150" fill="#ec4899" opacity="0.2" filter="blur(45px)" />
  </g>
  <g class="particle" style="animation-delay: 1s;">
    <circle cx="280" cy="60" r="3" fill="#60a5fa" />
  </g>
  <g class="particle" style="animation-delay: 2.5s;">
    <circle cx="940" cy="90" r="4" fill="#f472b6" />
  </g>
  <g class="particle" style="animation-delay: 4s;">
    <circle cx="1080" cy="110" r="3" fill="#a78bfa" />
  </g>

  <!-- Animated Soundwave Visualizer in bottom corners (strictly away from central text) -->
  <g fill="url(#primaryGrad)" opacity="0.85">
    <!-- Left Equalizer -->
    <rect class="bar-1" x="60" y="242" width="6" height="16" rx="3" />
    <rect class="bar-2" x="72" y="242" width="6" height="16" rx="3" />
    <rect class="bar-3" x="84" y="242" width="6" height="16" rx="3" />
    <rect class="bar-4" x="96" y="242" width="6" height="16" rx="3" />
    <rect class="bar-5" x="108" y="242" width="6" height="16" rx="3" />
    <rect class="bar-6" x="120" y="242" width="6" height="16" rx="3" />
    <rect class="bar-7" x="132" y="242" width="6" height="16" rx="3" />

    <!-- Right Equalizer -->
    <rect class="bar-7" x="1062" y="242" width="6" height="16" rx="3" />
    <rect class="bar-5" x="1074" y="242" width="6" height="16" rx="3" />
    <rect class="bar-3" x="1086" y="242" width="6" height="16" rx="3" />
    <rect class="bar-1" x="1098" y="242" width="6" height="16" rx="3" />
    <rect class="bar-2" x="1110" y="242" width="6" height="16" rx="3" />
    <rect class="bar-4" x="1122" y="242" width="6" height="16" rx="3" />
    <rect class="bar-6" x="1134" y="242" width="6" height="16" rx="3" />
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, & Tech Badges (Crisp, Clear, Prominent) -->
  <g id="foreground-text">
    <!-- Category Badge -->
    <rect x="475" y="42" width="250" height="30" rx="15" fill="#1f2937" stroke="#4b5563" stroke-width="1" />
    <circle cx="493" cy="57" r="4" fill="#10b981" />
    <text x="506" y="63" fill="#9ca3af" font-size="12.5" font-weight="600" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="132" text-anchor="middle" fill="#ffffff" font-size="46" font-weight="800" letter-spacing="-0.5">
      Awesome Media Players 🎬
    </text>

    <!-- Gradient Accent Sub-bar under Title -->
    <rect x="520" y="148" width="160" height="4" rx="2" fill="url(#primaryGrad)" />

    <!-- Subtitle -->
    <text x="600" y="195" text-anchor="middle" fill="#cbd5e1" font-size="18" font-weight="400">
      The definitive directory of high-performance desktop players, media servers &amp; self-hosted streamers
    </text>

    <!-- Feature Feature Badges -->
    <g transform="translate(325, 230)">
      <!-- Badge 1 -->
      <rect x="0" y="0" width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="80" y="22" text-anchor="middle" fill="#93c5fd" font-size="13" font-weight="600">📺 Video &amp; 4K/8K</text>

      <!-- Badge 2 -->
      <rect x="180" y="0" width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="270" y="22" text-anchor="middle" fill="#c4b5fd" font-size="13" font-weight="600">🎧 Hi-Res Audio Players</text>

      <!-- Badge 3 -->
      <rect x="380" y="0" width="170" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="465" y="22" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600">🌐 Self-Hosted Servers</text>
    </g>
  </g>
</svg>
